<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#F4EFE3;overflow:hidden}
.hero{position:relative;isolation:isolate;height:100vh;height:100svh;overflow:hidden;background:#F4EFE3;touch-action:none;color:#1d1a12;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.portrait{position:absolute;bottom:0;left:50%;transform:translateX(-50%);aspect-ratio:1024/1536;width:min(64vh,92vw)}
.portrait img,.portrait canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.portrait img{object-fit:cover;object-position:center top}
/* Base (black turtleneck) fully visible */
#base{opacity:1}
/* Ghost is only used by the canvas, keep it hidden */
#ghost{opacity:0;position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.mark{position:absolute;left:0;right:0;top:clamp(56px,9vh,110px);text-align:center;color:#171916;pointer-events:none;z-index:5}
.mark h1{font-weight:900;font-size:clamp(56px,10vw,152px);line-height:.82;letter-spacing:-.01em;white-space:nowrap;display:inline-block;text-transform:uppercase;font-family:"HelveticaNeue-CondensedBlack","HelveticaNeue-CondensedBold","AvenirNextCondensed-Heavy","Arial Narrow",Impact,sans-serif}
.mark br{display:none}
.tag{position:absolute;left:0;right:0;top:calc(clamp(20px,3.4vw,44px) + 12px);text-align:center;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;pointer-events:none;z-index:5;color:#4a4331}
.cta{position:absolute;top:clamp(20px,3.4vw,44px);right:clamp(20px,3.4vw,48px);padding:12px 24px;border-radius:999px;background:#B4E600;color:#14130E;font-size:13px;font-weight:700;letter-spacing:.02em;text-decoration:none;transition:transform .25s;z-index:20}
.cta:hover{transform:scale(1.05)}
.card{position:absolute;left:clamp(20px,3.4vw,48px);bottom:clamp(20px,3.4vw,44px);max-width:236px;padding:14px 16px;border-radius:14px;background:rgba(244,239,227,.88);border:1px solid rgba(59,51,32,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5}
.lbl{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.lbl i{width:8px;height:8px;border-radius:50%;background:#B4E600}
.card p{margin-top:8px;font-size:13px;line-height:1.45;color:#4a4331}
.top-nav{position:absolute;top:clamp(20px,3.4vw,44px);right:clamp(140px,18vw,220px);display:flex;align-items:center;gap:clamp(14px,2vw,24px);z-index:20}
.top-nav a{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#4a4331;text-decoration:none;transition:color .2s}
.top-nav a:hover{color:#14130E}
@media(max-width:768px){
  .mark br{display:inline}
  .tag{letter-spacing:.1em;font-size:10px;left:clamp(20px,3.4vw,48px);right:150px;text-align:left;top:calc(clamp(20px,3.4vw,44px) + 8px)}
  .portrait{width:min(58vh,118vw)}
  .card{max-width:200px}
  .top-nav{display:none}
}

.mute-btn{
  position:absolute;bottom:clamp(20px,3.4vw,44px);right:clamp(20px,3.4vw,48px);
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(59,51,32,.15);
  background:rgba(244,239,227,.9);backdrop-filter:blur(6px);cursor:pointer;z-index:20;
  display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s;
}
.mute-btn:hover{background:#fff;transform:scale(1.06)}
.mute-btn svg{width:18px;height:18px;fill:#1d1a12}
.mute-btn.muted svg.icon-on{display:none}
.mute-btn:not(.muted) svg.icon-off{display:none}


/* ===== Intro Loader ===== */
.loader{
  position:fixed;inset:0;z-index:9999;
  background:#0a0c12;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .7s ease, visibility .7s;
}
.loader.hide{
  opacity:0;visibility:hidden;pointer-events:none;
}
.loader-logo{
  width:min(140px,28vw);height:auto;
  opacity:0;transform:scale(.86);
  animation:logoIn .9s cubic-bezier(.22,1,.36,1) .15s forwards;
}
.loader-name{
  margin-top:28px;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:800;font-size:13px;letter-spacing:.28em;
  text-transform:uppercase;color:rgba(255,255,255,.9);
  opacity:0;transform:translateY(10px);
  animation:nameIn .7s cubic-bezier(.22,1,.36,1) .55s forwards;
}
.loader-bar{
  margin-top:36px;width:120px;height:2px;
  background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;
  opacity:0;animation:nameIn .5s ease .7s forwards;
}
.loader-bar i{
  display:block;height:100%;width:0;background:linear-gradient(90deg,#4da3ff,#a8e0ff);
  border-radius:2px;
  animation:barFill 1.6s cubic-bezier(.22,1,.36,1) .85s forwards;
}
@keyframes logoIn{to{opacity:1;transform:scale(1)}}
@keyframes nameIn{to{opacity:1;transform:none}}
@keyframes barFill{to{width:100%}}

</style>

  <svg class="icon-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>

<script>
(()=>{
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),ss=x=>x*x*(3-2*x);
const hero=$('.hero'),por=$('.portrait'),ghost=$('#ghost'),rv=$('#reveal'),bg=$('#bg');
const rctx=rv.getContext('2d'),bctx=bg.getContext('2d'),off=document.createElement('canvas'),octx=off.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,touch=matchMedia('(hover: none)').matches;
const LIFE=1600;
let vw,vh,dpr,rect,W,dabs=[],last=null,lastDab=0,inside=false,mouseIn=false,lastReal=-1e9,cur={x:0,y:0},tBg=0,prevT=performance.now(),acc=0,wasAlive=false,intro=null;

const wet=(d,now)=>{const a=(now-d.t)/LIFE;if(a>=1)return null;const k=a<.2?0:ss((a-.2)/.8);return{w:1-k,s:1-.38*k}};
function addDab(x,y){const now=performance.now();dabs.push({x:x+rnd(-.012,.012)*W,y:y+rnd(-.009,.009)*W,rx:rnd(.19,.32)*W,ry:rnd(.024,.052)*W,rot:rnd(-.2,.2),p:[rnd(0,6.28),rnd(0,6.28),rnd(0,6.28)],t:now});if(dabs.length>60)dabs.shift();lastDab=now}

function shape(c,d,s,now){const n=24,P=[],T=now*.00055,co=Math.cos(d.rot),si=Math.sin(d.rot);
 for(let i=0;i<n;i++){const a=i/n*6.2832,r=1+.15*Math.sin(2*a+d.p[0]+T)+.08*Math.sin(3*a+d.p[1]-T*.8)+.038*Math.sin(5*a+d.p[2]+T*.6),
  x=Math.cos(a)*d.rx*s*r,y=Math.sin(a)*d.ry*s*r;P.push([d.x+x*co-y*si,d.y+x*si+y*co])}
 c.beginPath();c.moveTo((P[n-1][0]+P[0][0])/2,(P[n-1][1]+P[0][1])/2);
 for(let i=0;i<n;i++){const p=P[i],q=P[(i+1)%n];c.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}
 c.closePath()}

function drawReveal(){const now=performance.now();let any=false;
 rctx.setTransform(1,0,0,1,0,0);rctx.globalCompositeOperation='source-over';rctx.globalAlpha=1;rctx.clearRect(0,0,rv.width,rv.height);
 rctx.setTransform(dpr,0,0,dpr,-rect.left*dpr,-rect.top*dpr);rctx.fillStyle='#000';
 for(const d of dabs){const q=wet(d,now);if(!q)continue;any=true;rctx.globalAlpha=q.w;shape(rctx,d,q.s,now);rctx.fill()}
 if(any&&ghost.complete&&ghost.naturalWidth){
   rctx.setTransform(1,0,0,1,0,0);rctx.globalAlpha=1;rctx.globalCompositeOperation='source-in';
   rctx.drawImage(ghost,0,0,rv.width,rv.height);rctx.globalCompositeOperation='source-over'
 }}

function strongest(now){let b=null;for(const d of dabs){const q=wet(d,now);if(q&&(!b||q.w>=b.w))b={x:d.x,y:d.y,w:q.w}}return b}

const CL=[{x:.16,y:.28,n:8,s:1,ph:0},{x:.86,y:.24,n:8,s:.95,ph:2},{x:.62,y:.88,n:8,s:1.1,ph:4}],RATE=[.18,-.13,.11],HK=[2,3,4],HW=[.5,.3,.2];
function paintBg(){const now=performance.now(),m=Math.min(vw,vh),R=.23*m,b=strongest(now);
 octx.setTransform(1,0,0,1,0,0);octx.clearRect(0,0,off.width,off.height);octx.setTransform(dpr,0,0,dpr,0,0);octx.fillStyle='#3B3320';
 for(const d of dabs){const q=wet(d,now);if(!q)continue;octx.globalAlpha=q.w;shape(octx,d,q.s,now);octx.fill()}
 bctx.setTransform(dpr,0,0,dpr,0,0);bctx.globalAlpha=1;bctx.fillStyle='#F4EFE3';bctx.fillRect(0,0,vw,vh);
 bctx.globalAlpha=.12;bctx.drawImage(off,0,0,vw,vh);bctx.globalAlpha=1;
 const P=[new Path2D(),new Path2D(),new Path2D()];
 for(const c of CL){const cx=(c.x+Math.sin(tBg*.05+c.ph)*.03)*vw,cy=(c.y+Math.cos(tBg*.04+c.ph)*.03)*vh,sp=.055*m*c.s;
  for(let i=0;i<c.n;i++){const r0=.05*m+i*sp,amp=Math.min(.4*sp,.3*r0),N=90;let px=0,py=0;
   for(let j=0;j<=N;j++){const a=j/N*6.2832;let r=r0;
    for(let k=0;k<3;k++)r+=amp*HW[k]*Math.sin(HK[k]*a+tBg*RATE[k]+c.ph*(k+1)+i*.2*(k+1));
    let x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r,mode=0;
    if(b){const dx=x-b.x,dy=y-b.y,d=Math.hypot(dx,dy)||1;
     if(d<R){const f=1-d/R,push=20*f*f*b.w;x+=dx/d*push;y+=dy/d*push;if(b.w>.04)mode=(d<.3*R&&b.w>.25)?2:1}}
    if(j){P[mode].moveTo(px,py);P[mode].lineTo(x,y)}px=x;py=y}}}
 bctx.lineWidth=1.2;bctx.lineCap='round';bctx.lineJoin='round';
 bctx.strokeStyle='#D8D0BF';bctx.stroke(P[0]);bctx.strokeStyle='rgba(252,250,243,.95)';bctx.stroke(P[1]);bctx.strokeStyle='#B4E600';bctx.stroke(P[2])}

function sync(){drawReveal();paintBg()}
function brush(x,y){const step=.026*W;
 if(!last){last={x,y};addDab(x,y)}else{const dx=x-last.x,dy=y-last.y,dist=Math.hypot(dx,dy);
  if(dist>=step){const n=Math.min(16,Math.floor(dist/step));
   for(let i=1;i<=n;i++){const px=last.x+dx/dist*step*i,py=last.y+dy/dist*step*i;addDab(px,py);if(Math.random()<.45)addDab(px,py)}
   last={x:last.x+dx/dist*step*n,y:last.y+dy/dist*step*n}}}
 cur={x,y};inside=true;sync()}

function resize(){dpr=Math.min(devicePixelRatio||1,2);vw=hero.clientWidth;vh=hero.clientHeight;
 bg.width=off.width=Math.round(vw*dpr);bg.height=off.height=Math.round(vh*dpr);
 rect=por.getBoundingClientRect();W=rect.width;rv.width=Math.round(rect.width*dpr);rv.height=Math.round(rect.height*dpr);sync()}

function real(e){lastReal=performance.now();mouseIn=true;brush(e.clientX,e.clientY)}
addEventListener('pointermove',real,{passive:true});addEventListener('pointerdown',real,{passive:true});
const up=e=>{if(e.pointerType==='touch'){mouseIn=inside=false;last=null}};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
document.documentElement.addEventListener('mouseleave',()=>{mouseIn=inside=false;last=null});
addEventListener('resize',resize);
ghost.addEventListener('load',()=>{drawReveal();sync()});
if(ghost.complete){drawReveal();sync()}

function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-prevT)/1000,.1);prevT=now;
 if(intro){const p=(now-intro)/2200;if(p>=1){intro=null;last=null;inside=mouseIn}else brush(rect.left+W*(.1+.8*ss(p)),rect.top+rect.height*(.38+.04*Math.sin(p*6.28)))}
 else if(touch&&now-lastReal>2200)brush(rect.left+W*(.5+.32*Math.sin(now*.0004)),rect.top+rect.height*(.36+.2*Math.sin(now*.00065+1.2)));
 if(inside&&now-lastDab>120)addDab(cur.x,cur.y);
 dabs=dabs.filter(d=>wet(d,now));const alive=dabs.length>0;
 if(alive||wasAlive)drawReveal();
 acc+=dt;if(acc>=1/30){if(!reduce)tBg+=acc;if(!reduce||alive||wasAlive)paintBg();acc=0}
 wasAlive=alive}

resize();requestAnimationFrame(tick);
setTimeout(()=>{intro=performance.now()},700);
})();
</script>
<script>
(()=>{const h1=document.querySelector('.mark h1');
function fit(){if(!h1)return;h1.style.fontSize='100px';const w=h1.getBoundingClientRect().width,pad=Math.min(48,Math.max(20,innerWidth*.034)),
 s=100*(innerWidth-2*pad)/w,cap=innerHeight*(innerWidth>768?.3:.2);h1.style.fontSize=Math.min(s,cap)+'px'}
fit();addEventListener('resize',fit);addEventListener('load',fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit)})();
</script>

<script>
(()=>{
  const audio = document.getElementById('bgMusic');
  const btn = document.getElementById('muteBtn');
  if(!audio || !btn) return;
  audio.volume = 0.35; // moderate volume
  let started = false;
  function tryPlay(){
    if(started) return;
    audio.play().then(()=>{ started=true; btn.classList.remove('muted'); }).catch(()=>{});
  }
  // try after first user interaction
  ['pointerdown','keydown','touchstart'].forEach(ev=>{
    window.addEventListener(ev, tryPlay, {once:true, passive:true});
  });
  btn.addEventListener('click', ()=>{
    if(audio.paused){
      audio.play().then(()=>{ btn.classList.remove('muted'); started=true; }).catch(()=>{});
    } else {
      audio.pause();
      btn.classList.add('muted');
    }
  });
})();
</script>


<script>
(()=>{
  const loader = document.getElementById('loader');
  if(!loader) return;
  // hide after animation (~2.4s) or when page is ready
  const hide = () => {
    loader.classList.add('hide');
    setTimeout(()=>loader.remove(), 800);
  };
  // wait for logo + bar animation
  setTimeout(hide, 2400);
  // also hide early if user interacts
  window.addEventListener('pointerdown', hide, {once:true});
})();
</script>
